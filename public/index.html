var AUTH_TOKEN = localStorage.getItem('auth_token') || null;

async function apiFetch(path, opts){
  opts = opts || {};
  var headers = {'Content-Type':'application/json'};
  if(AUTH_TOKEN) headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
  var res = await fetch(API_URL + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(res.status === 401){ AUTH_TOKEN=null; localStorage.removeItem('auth_token'); CU=null; render(); return null; }
  if(!res.ok){ var e=await res.json().catch(function(){return{error:'Error'}}); throw new Error(e.error||'Error '+res.status); }
  return res.json();
}

function bindLogin(){
  async function doLogin(){
    var u=document.getElementById('lu').value.trim();
    var p=document.getElementById('lp').value;
    var btnEl=document.getElementById('btn-login');
    btnEl.textContent='Ingresando...';btnEl.disabled=true;
    // Intentar con backend
    try{
      var emailMap={'Admin':'Admin','Refrigeracion':'miguelg8203@gmail.com','fabian':'fabian@refrigeracion.co'};
      var email=emailMap[u]||u;
      var data=await apiFetch('/api/auth/login',{method:'POST',body:{email:email,password:p}});
      if(data&&data.token){
        AUTH_TOKEN=data.token;
        localStorage.setItem('auth_token',data.token);
        CU={nombre:data.user.nombre,user:u,rol:data.user.rol,id:data.user.id};
        await cargarDatosIniciales();
        render();
        return;
      }
    }catch(e){
      console.log('Backend no disponible, usando login local');
    }
    // Fallback: login local
    var found=USUARIOS.find(function(x){return x.user===u&&x.pass===p&&x.activo;});
    if(found){
      CU=found;
      btnEl.textContent='Ingresar';btnEl.disabled=false;
      render();
    } else {
      var el=document.getElementById('lerr');
      el.style.display='block';el.textContent='Credenciales incorrectas';
      btnEl.textContent='Ingresar';btnEl.disabled=false;
    }
  }
  document.getElementById('btn-login').addEventListener('click',doLogin);
  document.getElementById('lp').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
}

    }).join('');

  return'<div style="padding:24px;max-width:1200px;margin:0 auto">'+

function openModal(pid){

  var eq=geq(p.equipo_id);
  var er=erealFn(p);
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px';
  var tecOpts=TECNICOS.filter(function(t){return t.activo;}).map(function(t){
    return'<option value="'+t.id+'"'+(p.responsable_id===t.id?' selected':'')+'>'+t.nombre+' '+t.apellido+'</option>';
  }).join('');
  ov.innerHTML='<div style="background:#fff;border-radius:16px;padding:28px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideIn .2s ease">'+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
  '<h3 style="margin:0;color:#0c1445;font-size:16px">Actualizar tarea</h3>'+
  '<button id="mc" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af">✕</button></div>'+
  '<div style="background:#f9fafb;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #e5e7eb">'+
  '<div style="font-weight:600;color:#0c1445;font-size:14px">'+(TIC[eq.tipo]||'🔧')+' '+eq.nombre+'</div>'+
  '<div style="font-size:13px;color:#374151;margin-top:4px;line-height:1.5">'+p.actividad+'</div>'+
  '<div style="font-size:12px;color:#9ca3af;margin-top:4px">'+p.parte+' · '+fmt(p.fecha_inicio)+'</div>'+
  '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+badge(p.plan)+' '+ebadge(er)+'</div></div>'+
  '<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">ASIGNAR TECNICO</label>'+
  '<select id="m-tec" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px">'+
  '<option value="">Sin asignar</option>'+tecOpts+'</select></div>'+
  '<div style="margin-bottom:16px"><label style="font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px">OBSERVACIONES <span style="color:#9ca3af;font-weight:400">(requerido para completar)</span></label>'+
  '<textarea id="m-obs" rows="3" placeholder="Ej: Se realizo limpieza completa..." style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;resize:vertical;font-family:inherit">'+(p.observaciones||'')+'</textarea></div>'+
  '<div id="m-err" style="display:none;background:#fff1f2;border:1px solid #fca5a5;color:#9f1239;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px"></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
  (er!=='COMPLETADO'?'<button id="m-comp" style="padding:10px 16px;background:#15803d;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;flex:1">✅ Completada</button>':'')+
  (er!=='VENCIDO'?'<button id="m-venc" style="padding:10px 16px;background:#9f1239;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;flex:1">❌ Vencida</button>':'')+
  (p.estado!=='PENDIENTE'?'<button id="m-reab" style="padding:10px 16px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px">↩️ Reabrir</button>':'')+
  '</div></div>';
  document.body.appendChild(ov);
  function close(){ov.remove();}
  async function upd(estado){
    var obs=document.getElementById('m-obs').value||null;
    var tid=document.getElementById('m-tec').value;
    try{
      var ep=estado==='COMPLETADO'?'completar':estado==='VENCIDO'?'vencer':'pendiente';
      await apiFetch('/api/programacion/'+pid+'/'+ep,{method:'PATCH',body:{observaciones:obs,tecnico_id:tid||null}});
      close();
      toast(estado==='COMPLETADO'?'✅ Tarea completada':estado==='VENCIDO'?'❌ Marcada como vencida':'↩️ Tarea reabierta');
      CRONO_DATA=[];filtros._loaded=false;DASH_DATA=null;
      await Promise.all([cargarCronograma(),cargarDashboard()]);
      render();
    }catch(e){
      var merr=document.getElementById('m-err');
      merr.style.display='block';merr.textContent='Error: '+e.message;
    }
  }
  ov.querySelector('#mc').addEventListener('click',close);
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  var mc=ov.querySelector('#m-comp');if(mc)mc.addEventListener('click',function(){
    var tid=document.getElementById('m-tec').value;
    var obs=(document.getElementById('m-obs').value||'').trim();
    var merr=document.getElementById('m-err');
    if(!tid){merr.style.display='block';merr.textContent='⚠️ Debes asignar un tecnico antes de completar.';return;}
    if(!obs){merr.style.display='block';merr.textContent='⚠️ Debes agregar observaciones antes de completar.';return;}
    merr.style.display='none';
    upd('COMPLETADO');
  });
  var mv=ov.querySelector('#m-venc');if(mv)mv.addEventListener('click',function(){upd('VENCIDO');});
  var mr=ov.querySelector('#m-reab');if(mr)mr.addEventListener('click',function(){upd('PENDIENTE');});
}

// Helpers Excel (CSV descargable como .xlsx compatible)
function descargarCSV(filename, rows){
  var bom='﻿';
  var csv=bom+rows.map(function(r){
    return r.map(function(c){
      var s=String(c===null||c===undefined?'':c);
      if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0) s='"'+s.replace(/"/g,'""')+'"';
      return s;
    }).join(',');
  }).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
}

function estadoClass(er){ return er==='COMPLETADO'?'comp':er==='VENCIDO'?'venc':'pend'; }

// ── REPORTE MENSUAL ───────────────────────────────────────────
function generarReporteMensual(mes){
  var items=PROGS.filter(function(p){return p.fecha_inicio.startsWith(mes);});
  var comp=items.filter(function(p){return p.estado==='COMPLETADO';}).length;
  var venc=items.filter(function(p){return erealFn(p)==='VENCIDO';}).length;
  var pend=items.filter(function(p){return erealFn(p)==='PENDIENTE';}).length;
  var pct=items.length>0?Math.round(comp/items.length*100):0;
  return {items:items,comp:comp,venc:venc,pend:pend,pct:pct,total:items.length};
}

function pdfMensual(mes){
  var r=generarReporteMensual(mes);
  var mNom=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var partes=mes.split('-');
  var titulo='Reporte Mensual - '+mNom[parseInt(partes[1])-1]+' '+partes[0];
  var filas=r.items.map(function(p){
    var eq=geq(p.equipo_id);
    var er=erealFn(p);
    var tec=p.responsable_id?TECNICOS.find(function(t){return t.id===p.responsable_id;}):null;
    return'<tr><td>'+p.fecha_inicio+'</td><td>'+eq.nombre+'</td><td>'+p.parte+'</td><td>'+p.actividad+'</td>'+
    '<td>'+p.plan+'</td><td>'+(tec?tec.nombre+' '+tec.apellido:'Sin asignar')+'</td>'+
    '<td><span class="badge '+estadoClass(er)+'">'+er+'</span></td></tr>';
  }).join('');
  var html='<h1>'+titulo+'</h1><div class="sub">Generado el '+new Date().toLocaleDateString('es-CO')+'</div>'+
  '<div class="resumen">'+
  '<div class="kpi"><div class="kpi-val">'+r.total+'</div><div class="kpi-lbl">Total tareas</div></div>'+
  '<div class="kpi"><div class="kpi-val" style="color:#15803d">'+r.comp+'</div><div class="kpi-lbl">Completadas</div></div>'+
  '<div class="kpi"><div class="kpi-val" style="color:#854d0e">'+r.pend+'</div><div class="kpi-lbl">Pendientes</div></div>'+
  '<div class="kpi"><div class="kpi-val" style="color:#9f1239">'+r.venc+'</div><div class="kpi-lbl">Vencidas</div></div>'+
  '<div class="kpi"><div class="kpi-val" style="color:#0369a1">'+r.pct+'%</div><div class="kpi-lbl">Cumplimiento</div></div>'+
  '</div>'+
  '<table><thead><tr><th>Fecha</th><th>Equipo</th><th>Parte</th><th>Actividad</th><th>Plan</th><th>Tecnico</th><th>Estado</th></tr></thead><tbody>'+filas+'</tbody></table>';
  imprimirHTML(titulo, html);
}

function excelMensual(mes){
  var r=generarReporteMensual(mes);
  var rows=[['Fecha','Equipo','Tipo','Area','Parte','Actividad','Plan','Tecnico','Estado','Observaciones']];
  r.items.forEach(function(p){
    var eq=geq(p.equipo_id);
    var er=erealFn(p);
    var tec=p.responsable_id?TECNICOS.find(function(t){return t.id===p.responsable_id;}):null;
    rows.push([p.fecha_inicio,eq.nombre,eq.tipo,eq.area,p.parte,p.actividad,p.plan,
      tec?tec.nombre+' '+tec.apellido:'Sin asignar',er,p.observaciones||'']);
  });
  descargarCSV('reporte-mensual-'+mes+'.csv', rows);
}

// ── REPORTE POR EQUIPO ────────────────────────────────────────
function pdfEquipo(eqId){
  var eq=geq(eqId);
  var items=PROGS.filter(function(p){return p.equipo_id===eqId;}).sort(function(a,b){return a.fecha_inicio.localeCompare(b.fecha_inicio);});
  var comp=items.filter(function(p){return p.estado==='COMPLETADO';}).length;
  var venc=items.filter(function(p){return erealFn(p)==='VENCIDO';}).length;
  var pend=items.filter(function(p){return erealFn(p)==='PENDIENTE';}).length;

  '<div class="sub">Sistema de Refrigeracion · Generado el '+new Date().toLocaleDateString('es-CO')+'</div>'+
  '<div class="resumen">'+
  '<div class="kpi"><div class="kpi-val">'+total+'</div><div class="kpi-lbl">Total programaciones</div></div>'+
  '<div class="kpi"><div class="kpi-val" style="color:#15803d">'+comp+'</div><div class="kpi-lbl">Completadas</div></div>'+
  '<div class="kpi"><div class="kpi-val" style="color:#854d0e">'+pend+'</div><div class="kpi-lbl">Pendientes</div></div>'+

    (tec?'<span style="font-size:11px;color:#6b7280">👷 '+tec.nombre+'</span>':'')+
    '</div></div></div>';
  }).join('');

  var ov=document.createElement('div');
  ov.id='notif-panel';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:flex-end;z-index:200;padding:16px';
  ov.innerHTML='<div style="background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideIn .25s ease;margin-top:52px">'+

  '<div>'+
  '<div style="font-size:16px;font-weight:700;color:#0c1445">🔔 Tareas vencidas</div>'+
  '<div style="font-size:12px;color:#9f1239;margin-top:2px;font-weight:600">'+vencidas.length+' tarea'+(vencidas.length!==1?'s':'')+' sin completar</div>'+
  '</div>'+

  '</div>'+
  '<div style="overflow-y:auto;padding:0 20px;flex:1">'+lista+
  (vencidas.length>20?'<div style="text-align:center;color:#6b7280;font-size:12px;padding:12px">...y '+(vencidas.length-20)+' mas</div>':'')+

  '<div style="padding:14px 20px;border-top:1px solid #f3f4f6;flex-shrink:0">'+
  '<button id="notif-ir-crono" style="width:100%;padding:10px;background:#0c1445;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Ver en Cronograma</button>'+
  '</div></div>';
  document.body.appendChild(ov);

  function closeNotif(){ov.remove();}
  ov.querySelector('#notif-close').addEventListener('click',closeNotif);
  ov.addEventListener('click',function(e){if(e.target===ov)closeNotif();});
  ov.querySelector('#notif-ir-crono').addEventListener('click',function(){
    closeNotif();
    filtros={mes:'',eq:'',plan:'',estado:'VENCIDO'};
    CV='cronograma';
    render();

  '<button id="btn-cfg-lock" style="width:100%;padding:10px;background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;cursor:pointer">🔒 Bloquear configuracion</button>'+
  '</div>';
}

// ── CALENDARIO ───────────────────────────────────────────────
function rCalendario(){
  var MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var DIAS_SEM=["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
  var anio=calAnio, mes=calMes;
  var primerDia=new Date(anio,mes,1).getDay();
  var totalDias=new Date(anio,mes+1,0).getDate();
  var mesStr=anio+'-'+(mes+1<10?'0'+(mes+1):(mes+1));
  var hoyStr=(function(){var h=new Date();return h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');})();

  // Agrupar programaciones por dia
  var porDia={};
  PROGS.forEach(function(p){
    if(p.fecha_inicio.startsWith(mesStr)){
      var d=parseInt(p.fecha_inicio.slice(8,10));
      if(!porDia[d])porDia[d]=[];
      porDia[d].push(p);
    }
  });

  // Resumen del mes
  var progsDelMes=PROGS.filter(function(p){return p.fecha_inicio.startsWith(mesStr);});
  var totalMes=progsDelMes.length;
  var compMes=progsDelMes.filter(function(p){return p.estado==='COMPLETADO';}).length;
  var vencMes=progsDelMes.filter(function(p){return erealFn(p)==='VENCIDO';}).length;
  var pendMes=progsDelMes.filter(function(p){return erealFn(p)==='PENDIENTE';}).length;

  // Cabecera días semana
  var cabHtml='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">'+
    DIAS_SEM.map(function(d){
      return'<div style="text-align:center;font-size:11px;font-weight:700;color:#6b7280;padding:6px 0;background:#f9fafb;border-radius:4px">'+d+'</div>';
    }).join('')+'</div>';

  // Celdas
  var celdas=[];
  var celVacia='<div style="background:#f3f4f6;border-radius:6px;height:110px"></div>';
  for(var i=0;i<primerDia;i++) celdas.push(celVacia);

  for(var d=1;d<=totalDias;d++){
    var dStr=mesStr+'-'+(d<10?'0'+d:d);
    var esHoy=dStr===hoyStr;
    var esSel=calDia===d;
    var tareas=porDia[d]||[];
    var venc=tareas.filter(function(p){return erealFn(p)==='VENCIDO';}).length;
    var pend=tareas.filter(function(p){return erealFn(p)==='PENDIENTE';}).length;
    var comp=tareas.filter(function(p){return p.estado==='COMPLETADO';}).length;
    var dotBg=venc>0?'#f87171':pend>0?'#fbbf24':comp>0?'#4ade80':'transparent';
    var border=esSel?'2px solid #0ea5e9':esHoy?'2px solid #0c1445':venc>0?'1px solid #f87171':pend>0?'1px solid #fbbf24':'1px solid #e5e7eb';
    var bg=esSel?'#f0f9ff':esHoy?'#eff6ff':'#fff';

    var miniTareas=tareas.slice(0,2).map(function(p){
      var er=erealFn(p);
      var tc=er==='COMPLETADO'?'#15803d':er==='VENCIDO'?'#9f1239':'#854d0e';
      var tbg=er==='COMPLETADO'?'#f0fdf4':er==='VENCIDO'?'#fff1f2':'#fefce8';
      var eq=geq(p.equipo_id);
      return'<div style="background:'+tbg+';color:'+tc+';font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(TIC[eq.tipo]||'🔧')+' '+eq.nombre+'</div>';
    }).join('');
    var masTag=tareas.length>2?'<div style="font-size:9px;color:#6b7280;text-align:right">+' +(tareas.length-2)+'</div>':'';

    celdas.push(
      '<div class="cal-dia" data-d="'+d+'" style="background:'+bg+';border:'+border+';border-radius:6px;height:110px;padding:5px;cursor:pointer;overflow:hidden;box-sizing:border-box">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">'+
      '<span style="font-size:12px;font-weight:'+(esHoy||esSel?700:400)+';color:'+(esHoy?'#0c1445':esSel?'#0369a1':'#374151')+'">'+d+'</span>'+
      (tareas.length>0?'<span style="width:7px;height:7px;border-radius:50%;background:'+dotBg+'"></span>':'')+
      '</div>'+
      miniTareas+masTag+
      '</div>'
    );
  }

  while(celdas.length%7!==0) celdas.push(celVacia);

  var gridHtml='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'+celdas.join('')+'</div>';

  // Panel del día seleccionado
  var panelHtml='';
  if(calDia){
    var dStr2=mesStr+'-'+(calDia<10?'0'+calDia:calDia);
    var tareasD=PROGS.filter(function(p){return p.fecha_inicio===dStr2;});
    var filas=!tareasD.length
      ?'<div style="color:#9ca3af;font-size:13px;text-align:center;padding:24px">Sin tareas este dia</div>'
      :tareasD.map(function(p){
          var eq=geq(p.equipo_id);
          var er=erealFn(p);
          var tec=p.responsable_id?TECNICOS.find(function(t){return t.id===p.responsable_id;}):null;
          var bc=(ESTADO_C[er]||ESTADO_C.PENDIENTE).border;
          return'<div class="cal-tarea" data-pid="'+p.id+'" style="background:#fff;border:1px solid '+bc+';border-left:4px solid '+bc+';border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:box-shadow .15s">'+
          '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:700;color:#0c1445">'+(TIC[eq.tipo]||'🔧')+' '+eq.nombre+'</div>'+
          '<div style="font-size:12px;color:#374151;margin-top:3px">'+p.actividad+'</div>'+
          '<div style="font-size:11px;color:#9ca3af;margin-top:2px">'+p.parte+(tec?' · 👷 '+tec.nombre+' '+tec.apellido:'')+'</div>'+
          '</div>'+
          '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+badge(p.plan)+ebadge(er)+'</div>'+
          '</div>';
        }).join('');
    panelHtml='<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
      '<div style="font-weight:700;color:#0c1445;font-size:15px">📋 '+calDia+' de '+MESES[mes]+' '+anio+'</div>'+
      '<button id="cal-cerrar-panel" style="padding:4px 12px;background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;border-radius:20px;font-size:12px;cursor:pointer">✕ Cerrar</button>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+filas+'</div>'+
      '</div>';
  }

  return'<div style="padding:24px;max-width:1100px;margin:0 auto;animation:fadeIn .3s ease">'+
    '<h2 style="margin:0 0 16px;color:#0c1445;font-size:20px;font-weight:700;text-align:center">📆 Calendario de Mantenimiento</h2>'+
    '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.06)">'+
    '<button id="cal-prev" style="padding:6px 14px;background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600">&#9664; Anterior</button>'+
    '<div style="text-align:center">'+
    '<div style="font-size:18px;font-weight:700;color:#0c1445">'+MESES[mes]+' '+anio+'</div>'+
    '<div style="font-size:12px;color:#6b7280;margin-top:2px;display:flex;gap:14px;justify-content:center">'+
    '<span>📋 '+totalMes+'</span><span style="color:#15803d">✅ '+compMes+'</span><span style="color:#854d0e">⏳ '+pendMes+'</span><span style="color:#9f1239">❌ '+vencMes+'</span>'+
    '</div></div>'+
    '<button id="cal-next" style="padding:6px 14px;background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600">Siguiente &#9654;</button>'+
    '</div>'+
    '<div style="display:flex;gap:16px;margin-bottom:8px;font-size:11px;color:#6b7280;flex-wrap:wrap">'+
    '<span>🔴 Vencida &nbsp;🟡 Pendiente &nbsp;🟢 Completada &nbsp;🔵 Hoy &nbsp;◻️ Seleccionado</span>'+
    '</div>'+
    '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)">'+
    cabHtml+gridHtml+
    '</div>'+
    panelHtml+
    '</div>';
}

// ── ARRANQUE ─────────────────────────────────────────────────
(async function(){
  // Verificar token guardado
  if(AUTH_TOKEN){
    try{
      var me=await apiFetch('/api/auth/me');
      if(me&&me.user){
        CU={nombre:me.user.nombre,user:me.user.email,rol:me.user.rol,id:me.user.id};
        await cargarDatosIniciales();
      }
    }catch(e){AUTH_TOKEN=null;localStorage.removeItem('auth_token');}
  }
  render();
})();
</script>
